<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>猜数字游戏</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#12121a;color:#fff;display:flex;flex-direction:column;align-items:center;padding:40px;font-size:20px}
        .box{background:#1e1e2f;padding:30px;border-radius:12px;text-align:center}
        input{padding:8px;font-size:18px;width:160px;margin:10px 0;border-radius:6px;border:none}
        button{padding:8px 16px;background:#4060ff;color:white;border:none;border-radius:6px;font-size:18px;cursor:pointer;margin:5px}
        #tip{margin:15px 0;color:#ffdd66}
        .back{margin-top:20px;padding:8px 14px;background:#4060ff;color:#fff;text-decoration:none;border-radius:6px}
    </style>
</head>
<body>
    <div class="box">
        <h2>猜数字（1~100）</h2>
        <p>我心里想了一个1到100之间的数字，你来猜猜！</p>
        <input type="number" id="numInput" placeholder="输入数字">
        <br>
        <button onclick="check()">提交猜测</button>
        <button onclick="restart()">重新开始</button>
        <div id="tip"></div>
    </div>
    <a class="back" href="../index.html">返回首页</a>

    <script>
        let answer;
        function resetGame(){
            answer = Math.floor(Math.random()*100)+1;
            document.getElementById("tip").innerText = "";
            document.getElementById("numInput").value = "";
        }
        resetGame();

        function check(){
            let val = Number(document.getElementById("numInput").value);
            let tipDom = document.getElementById("tip");
            if(isNaN(val) || val<1 || val>100){
                tipDom.innerText = "请输入1~100之间的数字！";
                return;
            }
            if(val < answer){
                tipDom.innerText = "太小了！再试试";
            }else if(val > answer){
                tipDom.innerText = "太大了！再试试";
            }else{
                tipDom.innerText = "🎉恭喜你猜对了！答案就是"+answer;
            }
        }
        function restart(){
            resetGame();
        }
    </script>
</body>
</html>
