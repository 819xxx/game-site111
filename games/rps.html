<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>石头剪刀布</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#12121a;color:#fff;display:flex;flex-direction:column;align-items:center;padding:40px;font-size:20px}
        .box{background:#1e1e2f;padding:30px;border-radius:12px;text-align:center}
        button{padding:12px 20px;margin:8px;background:#4060ff;color:white;border:none;border-radius:6px;font-size:18px;cursor:pointer}
        #result{margin:20px 0;color:#ffdd66;font-size:22px}
        .back{margin-top:20px;padding:8px 14px;background:#4060ff;color:#fff;text-decoration:none;border-radius:6px}
    </style>
</head>
<body>
    <div class="box">
        <h2>石头剪刀布</h2>
        <p>请选择：</p>
        <div>
            <button onclick="play('石头')">✊ 石头</button>
            <button onclick="play('剪刀')">✌️ 剪刀</button>
            <button onclick="play('布')">🖐️ 布</button>
        </div>
        <div id="result"></div>
    </div>
    <a class="back" href="../index.html">返回首页</a>

    <script>
        const arr = ["石头","剪刀","布"];
        function play(user){
            // 电脑随机选
            let pc = arr[Math.floor(Math.random()*3)];
            let resText;
            if(user === pc){
                resText = `你选：${user}，电脑选：${pc} → 平局！`
            }else if(
                (user==="石头" && pc==="剪刀") ||
                (user==="剪刀" && pc==="布") ||
                (user==="布" && pc==="石头")
            ){
                resText = `你选：${user}，电脑选：${pc} → 🎉你赢了！`
            }else{
                resText = `你选：${user}，电脑选：${pc} → 😥你输了！`
            }
            document.getElementById("result").innerText = resText;
        }
    </script>
</body>
</html>
